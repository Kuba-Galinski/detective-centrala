<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Centrala · Młynówka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Special+Elite&display=swap">
<style>
/* Układ: jedna wąska kolumna jak drukowany rejestr; każda koperta to numerowany arkusz raportu, odblokowywany po kolei. */
:root{
  --bg:#12100f; --panel:#1c1917; --line:#352f2b; --fg:#e8e1da; --muted:#9a8f86;
  --accent:#d9a441; --alert:#d86a7c; --ok:#71b48a; --on-accent:#1a1205;
  color-scheme:dark;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-stamp:"Special Elite","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--f-ui);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{border-bottom:1px solid var(--line);padding-bottom:16px;display:flex;flex-direction:column;gap:4px}
.sys{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-stamp);font-weight:400;font-size:clamp(30px,7vw,44px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
.case{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.progress{display:flex;gap:6px;margin-top:8px}
.progress span{flex:1;height:6px;border-radius:1px;background:var(--line)}
.progress span.done{background:var(--ok)}
.progress span.now{background:var(--accent)}
#stages{display:flex;flex-direction:column;gap:22px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;min-width:0}
.sheet.locked{opacity:.45}
.sheet h2{margin:0;font-size:13px;font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-right:175px}
.q{font-size:22px;font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.note{color:var(--muted);font-size:14px;margin:0}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label{font-size:15px;font-weight:500}
.fmark{font-family:var(--f-mono);font-size:12px;min-height:1.2em}
.fmark.ok{color:var(--ok)}
.fmark.mid{color:var(--accent)}
input,select{font:inherit;font-family:var(--f-mono);font-size:16px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:10px 12px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:2px;padding:10px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.msg{font-family:var(--f-mono);font-size:14px;min-height:1.4em;margin:0}
.msg.bad{color:var(--alert)}
.hints{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.hints[hidden]{display:none}
.hint{font-size:15px;border-left:2px solid var(--accent);padding:4px 0 4px 12px;margin:0}
.hint b{font-family:var(--f-mono);font-size:12px;color:var(--accent);display:block;letter-spacing:.08em}
.result{border:1px solid var(--ok);border-radius:3px;padding:16px 18px;background:color-mix(in srgb,var(--ok) 7%,var(--panel));overflow-wrap:anywhere}
.result p,.result li{font-size:16px}
.result h3{font-family:var(--f-stamp);font-weight:400;font-size:22px;margin:0 0 8px}
.result h4{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.result ul{padding-left:20px;margin:0;display:flex;flex-direction:column;gap:6px}
.order{font-family:var(--f-stamp);font-size:22px;color:var(--alert);border:2px solid var(--alert);display:inline-block;padding:4px 12px;transform:rotate(-2deg);margin-top:6px}
.stamp{position:absolute;top:14px;right:16px;font-family:var(--f-stamp);color:var(--ok);border:2px solid var(--ok);padding:2px 8px;transform:rotate(4deg);font-size:14px}
footer{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
.linklike{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0;font-weight:400;font-size:13px;align-self:flex-start}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="sys">System Centrala · Prokuratura Okręgowa w Legnicy</span>
    <h1>Młynówka</h1>
    <span class="case">w sprawie zabójstwa i zaginięć w Gaworzycach, lipiec 2024</span>
    <div class="progress" id="prog" aria-hidden="true"></div>
  </header>
  <div id="stages"></div>
  <footer>
    <span>Odpowiedzi są zaszyfrowane. Raport odczytacie dopiero po wpisaniu poprawnego rozwiązania. Postęp zapisuje się na tym urządzeniu.</span>
    <button class="linklike" id="reset" type="button">Zacznij sprawę od nowa</button>
    <div class="confirm" id="resetBox" hidden>
      <span>Na pewno? Postęp i podpowiedzi znikną.</span>
      <button type="button" id="resetYes">Tak, wyczyść</button>
      <button type="button" class="ghost" id="resetNo">Anuluj</button>
    </div>
  </footer>
</div>

const SALT = "a2586a908da0d40a1ecda1a308fc8e72";
const KEY = "centrala:gra-03:a2586a908da0";
const te = new TextEncoder();
const td = new TextDecoder();

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function fresh(){return {solved:{},hints:{},fields:{}}}
let st=Object.assign(fresh(),load());

// Normalizacja i kandydaci: identyczne jak studio/centrala/crypto.py.
const norm=t=>t.toLowerCase().replace(/ł/g,"l").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const words=v=>v.split(/[\s,.;:!?\-\/]+/).map(norm).filter(Boolean);
function cands(v){
  const out=new Set();const whole=norm(v);if(whole)out.add(whole);
  for(const t of words(v)){out.add(t);for(let k=3;k<=6;k++)if(t.length>=k)out.add(t.slice(0,k))}
  return [...out];
}
async function sha(s){
  const b=await crypto.subtle.digest("SHA-256",te.encode(SALT+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(material,box){
  const kb=await crypto.subtle.digest("SHA-256",te.encode(SALT+"key:"+material));
  const key=await crypto.subtle.importKey("raw",kb,"AES-GCM",false,["decrypt"]);
  return td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct)));
}
// Każdy etap jest zaszyfrowany odpowiedziami poprzedniego, więc źródło strony nie zdradza kolejnych pytań.
function sealMaterial(i){
  const s=DATA.stages[i];
  if(i===0)return "open:"+s.id;
  const prev=DATA.stages[i-1];
  return "next:"+prev.id+":"+st.solved[prev.id];
}
async function openStage(i){
  return JSON.parse(await dec(sealMaterial(i),DATA.stages[i].sealed));
}
async function checkField(f,val){
  let list=f.type==="text"?cands(val):[norm(val)];
  // Akta podają sekundy, a odpowiedź to gg:mm, więc końcowe sekundy odcinamy.
  if(f.type==="time"&&/^\d{5,6}$/.test(list[0]))list=[list[0].slice(0,-2)];
  if(f.type==="text"&&words(val).length>f.maxWords)return {ok:false,tooLong:true};
  for(const c of list){
    const h=await sha(f.id+":"+c);
    if(f.ok[h])return {ok:true,canon:await dec(f.id+":"+c,f.ok[h])};
  }
  for(const c of list){
    const h=await sha(f.id+":n:"+c);
    if(f.near[h])return {ok:false,near:await dec("near:"+f.id+":"+c,f.near[h])};
  }
  return {ok:false};
}

const root=document.getElementById("stages");
function el(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else e.setAttribute(k,v)}
  for(const k of kids)e.append(k);
  return e;
}

let renderToken=0;
async function render(){
  const token=++renderToken;
  const built=[];
  const prog=document.getElementById("prog");
  prog.textContent="";
  let firstOpen=DATA.stages.findIndex(s=>st.solved[s.id]===undefined);
  if(firstOpen<0)firstOpen=DATA.stages.length;
  for(let i=0;i<DATA.stages.length;i++){
    const s=DATA.stages[i];
    prog.append(el("span",{class:st.solved[s.id]!==undefined?"done":(i===firstOpen?"now":"")}));
    built.push(i>firstOpen?lockedSheet(s):await openSheet(s,i));
    if(token!==renderToken)return;
  }
  root.replaceChildren(...built);
}
function lockedSheet(s){
  return el("section",{class:"sheet locked",id:"s"+s.id},
    el("h2",{},s.label),
    el("p",{class:"note"},"Odblokuje się po zatwierdzeniu poprzedniego raportu."));
}
async function openSheet(s,i){
  const sec=el("section",{class:"sheet",id:"s"+s.id});
  let p;
  try{p=await openStage(i)}catch(e){
    sec.append(el("h2",{},s.label),el("p",{class:"note"},"Nie udało się odczytać etapu. Zacznijcie sprawę od nowa."));
    return sec;
  }
  sec.append(el("h2",{},p.title),el("p",{class:"q"},p.q));
  if(st.solved[s.id]!==undefined){
    sec.append(el("span",{class:"stamp"},i===DATA.stages.length-1?"SPRAWA ZAMKNIĘTA":"ZATWIERDZONO"));
    const r=el("div",{class:"result"});
    try{r.innerHTML=await dec(s.id+":"+st.solved[s.id],s.okc)}catch(e){r.textContent="Nie udało się odczytać raportu."}
    sec.append(r);
    return sec;
  }
  const form=el("form",{autocomplete:"off"});
  const marks={};
  p.fields.forEach(f=>{
    const id="in_"+f.id;
    const box=el("div",{class:"field"});
    box.append(el("label",{for:id},f.label));
    let inp;
    if(f.type==="select"){
      inp=el("select",{id});
      for(const[v,t]of f.options)inp.append(el("option",{value:v},t));
    }else{
      inp=el("input",{id,type:"text",placeholder:f.ph||"",autocapitalize:"off",spellcheck:"false",inputmode:f.type==="time"?"numeric":"text"});
    }
    if(st.fields[f.id]!==undefined)inp.value=st.fields[f.id];
    inp.addEventListener("input",()=>{st.fields[f.id]=inp.value;save()});
    const m=el("span",{class:"fmark"});
    marks[f.id]=m;
    box.append(inp,m);
    form.append(box);
  });
  const hb=el("button",{type:"button",class:"ghost"});
  const row=el("div",{class:"row"},el("button",{type:"submit"},"Wyślij raport do prokuratora"),hb);
  const msg=el("p",{class:"msg","aria-live":"polite"});
  form.append(row,msg);
  sec.append(form);
  const hl=el("div",{class:"hints"});
  sec.append(hl);
  const drawHints=()=>{
    const n=st.hints[s.id]||0;
    hl.textContent="";
    hl.hidden=n===0;
    for(let k=0;k<n;k++){
      const para=el("p",{class:"hint"},el("b",{},"PODPOWIEDŹ "+(k+1)));
      para.append(p.hints[k]);
      hl.append(para);
    }
    hb.textContent=n>=p.hints.length?"Wykorzystano wszystkie podpowiedzi":"Poproś o podpowiedź ("+n+"/"+p.hints.length+")";
    hb.disabled=n>=p.hints.length;
  };
  hb.onclick=()=>{st.hints[s.id]=Math.min((st.hints[s.id]||0)+1,p.hints.length);save();drawHints()};
  drawHints();
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    msg.className="msg";
    msg.textContent="Sprawdzam…";
    const canon=[];
    let good=0;
    for(const f of p.fields){
      const v=document.getElementById("in_"+f.id).value.trim();
      const m=marks[f.id];
      if(!v){m.className="fmark";m.textContent="";canon.push(null);continue}
      const r=await checkField(f,v);
      if(r.ok){good++;canon.push(r.canon);m.className="fmark ok";m.textContent="✓ zgadza się"}
      else if(r.near){canon.push(null);m.className="fmark mid";m.textContent=r.near}
      else if(r.tooLong){canon.push(null);m.className="fmark mid";m.textContent="Za dużo słów. Wpiszcie krótszą odpowiedź."}
      else{canon.push(null);m.className="fmark";m.textContent=""}
    }
    if(good===p.fields.length){
      st.solved[s.id]=canon.join("|");
      save();
      await render();
      const target=document.getElementById("s"+s.id);
      if(target&&target.scrollIntoView)target.scrollIntoView({behavior:"smooth",block:"start"});
    }else{
      msg.className="msg bad";
      msg.textContent="Prokurator odrzuca raport. Zgadza się "+good+" z "+p.fields.length+" odpowiedzi.";
    }
  });
  return sec;
}

document.getElementById("reset").onclick=()=>{document.getElementById("resetBox").hidden=false};
document.getElementById("resetNo").onclick=()=>{document.getElementById("resetBox").hidden=true};
document.getElementById("resetYes").onclick=()=>{
  try{localStorage.removeItem(KEY)}catch(e){}
  st=fresh();
  document.getElementById("resetBox").hidden=true;
  render();
};
if(window.crypto&&crypto.subtle){render()}
else{root.textContent="Ta strona wymaga połączenia https. Otwórzcie ją z adresu z kodu QR."}
